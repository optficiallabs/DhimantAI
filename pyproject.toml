[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhimantai"
version = "0.3.0"
description = "Open education technology utilities for guided learning, access control, and secure institution workflows."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Optficial Labs Pvt Ltd."}]

[project.scripts]
dhimantai = "src.cli:main"

[tool.setuptools]
packages = ["src"]
